<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wife birthday ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #fff8d6;
    color: #251900;
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
}

.bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(circle at 15% 15%, #fff36a 0, transparent 30%),
        radial-gradient(circle at 85% 10%, #ffd43b 0, transparent 28%),
        radial-gradient(circle at 50% 85%, #ffb703 0, transparent 35%),
        linear-gradient(135deg, #fffbe6, #fff2a8);
}

.noise {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

main {
    min-height: 100vh;
}

.hero {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px 22px;
    position: relative;
}

.eyebrow {
    letter-spacing: .3em;
    text-transform: uppercase;
    font-size: .72rem;
    font-weight: 700;
    color: #a86600;
    margin-bottom: 20px;
    animation: rise 1s ease both;
}

h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(5rem, 20vw, 12rem);
    line-height: .72;
    margin: 0;
    font-weight: 600;
    letter-spacing: -.06em;
    background: linear-gradient(
        135deg,
        #ffcf00,
        #ff9f00 45%,
        #ff6b00
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 15px 50px rgba(255, 174, 0, .25);
    animation: rise 1s .12s ease both;
}

.subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    color: #3a2500;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    margin: 35px 0 8px;
    animation: rise 1s .25s ease both;
}

.date {
    color: #855600;
    font-weight: 500;
    animation: rise 1s .35s ease both;
}

.scroll {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .68rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    font-weight: 700;
    color: #936000;
}

.scroll span {
    display: block;
    width: 2px;
    height: 35px;
    background: #ffad00;
    margin: 9px auto 0;
    animation: pulse 1.5s infinite;
}

.section {
    max-width: 950px;
    margin: auto;
    padding: 110px 25px;
}

.card {
    border: 2px solid rgba(255, 179, 0, .35);
    background: rgba(255, 255, 235, .72);
    backdrop-filter: blur(18px);
    border-radius: 32px;
    padding: clamp(30px, 7vw, 75px);
    box-shadow:
        0 30px 100px rgba(178, 108, 0, .15),
        inset 0 1px 0 rgba(255, 255, 255, .9);
}

.kicker {
    text-transform: uppercase;
    letter-spacing: .25em;
    font-size: .68rem;
    font-weight: 700;
    color: #d17b00;
}

h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 600;
    line-height: .9;
    margin: 18px 0 30px;
    color: #332000;
}

.message {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.35rem, 3vw, 2rem);
    line-height: 1.45;
    color: #493400;
}

.highlight {
    color: #e88900;
    font-weight: 600;
}

.reasons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 35px;
}

.reason {
    padding: 25px 20px;
    border-radius: 22px;
    background: linear-gradient(
        145deg,
        rgba(255, 229, 73, .55),
        rgba(255, 189, 0, .25)
    );
    border: 1px solid rgba(225, 145, 0, .25);
    transition: .3s;
    box-shadow: 0 10px 30px rgba(190, 120, 0, .08);
}

.reason:hover {
    transform: translateY(-6px) rotate(-1deg);
    background: linear-gradient(
        145deg,
        rgba(255, 235, 76, .8),
        rgba(255, 185, 0, .4)
    );
    box-shadow: 0 18px 40px rgba(190, 120, 0, .16);
}

.number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.7rem;
    font-weight: 700;
    color: #e18a00;
}

.reason p {
    color: #604600;
    line-height: 1.55;
    font-size: .9rem;
}

.final {
    text-align: center;
    padding: 120px 25px 150px;
}

.final h2 {
    margin-bottom: 12px;
    color: #3a2500;
}

.final p {
    color: #765800 !important;
}

button {
    border: 0;
    border-radius: 999px;
    padding: 16px 28px;
    background: linear-gradient(135deg, #ffd60a, #ff9f00);
    color: #382000;
    font-weight: 700;
    cursor: pointer;
    box-shadow:
        0 10px 35px rgba(255, 166, 0, .28),
        inset 0 1px 0 rgba(255, 255, 255, .65);
    transition: .25s;
}

button:hover {
    transform: scale(1.06) translateY(-2px);
    box-shadow:
        0 15px 45px rgba(255, 166, 0, .4),
        0 0 30px rgba(255, 213, 0, .25);
}

#secret {
    max-height: 0;
    overflow: hidden;
    transition: max-height .8s ease, opacity .8s ease;
    opacity: 0;
}

#secret.show {
    max-height: 300px;
    opacity: 1;
}

.heart {
    color: #ff9500;
    font-size: 2.5rem;
    margin-top: 25px;
    display: block;
    animation: beat 1.2s infinite;
    filter: drop-shadow(0 5px 12px rgba(255, 145, 0, .35));
}

footer {
    text-align: center;
    color: #a07828;
    font-size: .7rem;
    padding: 25px;
}

@keyframes rise {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%, 100% {
        opacity: .25;
        transform: scaleY(.7);
    }

    50% {
        opacity: 1;
        transform: scaleY(1);
    }
}

@keyframes beat {
    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.18);
    }

    30% {
        transform: scale(1);
    }
}

@media (max-width: 700px) {
    .reasons {
        grid-template-columns: 1fr;
    }

    .section {
        padding: 70px 18px;
    }

    .card {
        border-radius: 25px;
    }
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="noise"></div>
<canvas id="hearts"></canvas>

<main>
<section class="hero">
<div>
<div class="eyebrow">A very important announcement</div>
<h1>26</h1>
<div class="subtitle">YAYAYAYAY</div>
<div class="date">Happy Birthday :):)</div>
</div>
<div class="scroll">keep going<span></span></div>
</section>

<section class="section">
<div class="card">
<div class="kicker">To my favorite person</div>
<h2>You are so<br>wonderful:)</h2>
<div class="message">
<span class="highlight">I hope 26 is your best year yet.</span>
</div>
</section>

<section class="final">
<div class="kicker">One last thing</div>
<h2>Make a wish.</h2>
<p style="color:#bdaab2;margin-bottom:28px">It's not a cat (or dog :( )</p>
<button onclick="reveal()">There's a secret here</button>
<div id="secret">
<span class="heart">♥</span>
<div class="message">Musi musi:):)<br>(nuga)</div>
</div>
</section>
</main>

<footer>Made with an unreasonable amount of love ♡</footer>

<script>
const canvas=document.getElementById('hearts'),ctx=canvas.getContext('2d');
let w,h,hearts=[];
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
addEventListener('resize',resize);resize();
for(let i=0;i<45;i++)hearts.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*5+2,v:Math.random()*.5+.2,a:Math.random()*.45+.1,r:Math.random()*Math.PI*2});
function draw(){
ctx.clearRect(0,0,w,h);
for(const p of hearts){
p.y-=p.v;p.r+=.003;
if(p.y<-20){p.y=h+20;p.x=Math.random()*w}
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
ctx.globalAlpha=p.a;ctx.font=p.s*3+'px serif';ctx.fillText('♥',0,0);ctx.restore()
}
requestAnimationFrame(draw)
}
draw();
function reveal(){
document.getElementById('secret').classList.add('show');
for(let i=0;i<80;i++)hearts.push({x:w/2+(Math.random()-.5)*250,y:h*.75,s:Math.random()*6+3,v:Math.random()*2+1,a:.8,r:Math.random()*Math.PI*2})
}
</script>
</body>
</html>
